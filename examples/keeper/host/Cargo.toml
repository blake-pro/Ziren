[package]
name = "keeper-host"
version = { workspace = true }
edition = { workspace = true }
default-run = "keeper-host"
publish = false

[dependencies]
serde = { version = "1.0.144", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5.0"
hex = "0.4.3"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "http2", "system-proxy"] }
zkm-sdk = { workspace = true }
tracing = { workspace = true }
zkm-core-executor = { workspace = true }
strum = "0.26"
dotenv = "0.15.0"

[build-dependencies]
zkm-build = { workspace = true }

[[bin]]
name = "keeper-host"
path = "src/main.rs"

# [features]
# cuda = ["zkm-sdk/cuda"]
